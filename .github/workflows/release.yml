name: Release

# Tags are v<NetHack version>-<revision of this app>, e.g. v5.0.0-1.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      build_number: ${{ steps.parse.outputs.build_number }}
    steps:
      - id: parse
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not of the form v5.0.0-1"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build_number: ${{ needs.version.outputs.build_number }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: app
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ needs.build.outputs.zip }}" \
            --title "NetHack ${{ needs.version.outputs.version }} for macOS (release ${{ needs.version.outputs.build_number }})" \
            --notes-file .github/release-notes.md

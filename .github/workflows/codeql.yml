name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 22 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp]
    steps:
      - uses: actions/checkout@v7

      # Objective-C isn't analysed by CodeQL, so this covers only the port's C files.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            threat-models: local
            paths:
              - win/cocoa
              - .github

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
